[package]
name = "search-service"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
connectrpc = { version = "0.9.1", default-features = false, features = ["client"] }
loams = { version = "=0.1.2", default-features = false }
loams-proto = { version = "=0.1.2", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
